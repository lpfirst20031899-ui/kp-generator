<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор КП · Green Building</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>window.KP_ASSETS = {};</script>
<style>
  :root{
    --green:#2fb14f; --green-d:#219a41; --ink:#1a2230; --muted:#6b7686;
    --line:#e5e9ef; --bg:#eef1f5; --card:#fff; --danger:#d64545; --warn:#c8892a;
    --radius:12px; --shadow:0 1px 3px rgba(20,30,50,.08),0 8px 24px rgba(20,30,50,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
  .app{display:grid;grid-template-columns:400px 1fr;min-height:100vh}
  /* ── Ліва панель: опитувальник ── */
  .side{background:var(--card);border-right:1px solid var(--line);padding:22px 22px 40px;overflow-y:auto;height:100vh}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:var(--green);display:grid;place-items:center;color:#fff;font-weight:800}
  .brand h1{font-size:16px;margin:0;font-weight:700}
  .brand small{color:var(--muted);font-weight:500;display:block;font-size:11.5px}
  .step{margin-top:18px}
  .step-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:8px}
  .step-h .n{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
  label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
  input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--green)}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px;margin-top:2px}
  .seg button{flex:1;border:none;background:none;padding:8px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:600;font-family:inherit}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .btn{width:100%;padding:11px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
  .btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:var(--green-d)}
  .btn-dark{background:var(--ink);color:#fff;margin-top:8px}.btn-dark:hover{opacity:.9}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn-ghost:hover{border-color:var(--muted)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .hint{font-size:11.5px;color:var(--muted);margin-top:5px}
  /* Галочки-опції. Звичайний чекбокс із дрібним підписом менеджер просто не бачив (саме так
     знята автоматика доїжджала в КП), тому кожна опція — картка на всю ширину, і ввімкнена
     зеленіє так само, як решта «активного» в сервісі. */
  .opt{display:flex;align-items:center;gap:10px;margin:8px 0 0;padding:11px 12px;border:1px solid var(--line);
       border-radius:10px;background:#fff;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:.15s}
  .opt:hover{border-color:var(--muted)}
  .opt input{width:18px;height:18px;flex:none;margin:0;accent-color:var(--green);cursor:pointer}
  .opt:has(input:checked){border-color:var(--green);background:#f1fbf4;color:var(--green-d)}
  .pill{display:inline-block;background:#eafaef;color:var(--green-d);border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600}
  .warn-box{background:#fff7ec;border:1px solid #f0d8a8;color:#8a5a12;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:12px}
  .warn-box b{color:var(--danger)}
  .adv{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
  .adv summary{cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:600}
  /* ── Права панель: превʼю ── */
  .main{padding:26px 26px 60px;overflow-y:auto;height:100vh}
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .toolbar .sp{flex:1}
  .status{font-size:13px;color:var(--muted)}
  .stage{display:flex;justify-content:center}
  .kp-doc{transform-origin:top center}
  /* ── Документ КП: 1:1 з оригіналом ── */
  /* висота фіксована = A4 → превʼю 1:1 з PDF (раніше сторінка «стискалась» і білі поля було не видно) */
  .kp-page{width:210mm;height:297mm;background:#fff;box-shadow:var(--shadow);margin:0 auto 18px;position:relative;
    padding:0 0 12mm;overflow:hidden;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;color:#111}
  .kp-banner{width:100%;display:block}
  /* Шапка: хвиля й логотип — два вікна в той самий banner_hq.jpg, контакти — текст.
     Так у assets/ не зʼявляється нових файлів: при оновленні на GitHub заливаються ті самі
     kp_generator.html і kp_proxy.py, а забути докласти картинку вже неможливо.
     Числа — координати в оригіналі 1900×677: хвиля 0..468, лого 123..525 × 490..665,
     колонки тексту x 694 і x 1255 (1 px = 0.1105 мм). */
  .kp-wave{width:100%;aspect-ratio:1900/468;overflow:hidden;display:block}
  .kp-wave img{width:100%;display:block}
  .kp-logo{width:44.4mm;aspect-ratio:402/175;overflow:hidden;position:relative;flex:none;margin-top:1.85mm}
  /* 1900/402 = 472.64% ширини вікна; зсув — частка вікна, тому саме /402 і /175 */
  .kp-logo img{position:absolute;width:472.64%;left:-30.6%;top:-280%;max-width:none}
  .kp-head{display:flex;align-items:flex-start;padding:0.6mm 0 2.2mm 13.6mm}
  .kp-head .cc{font-size:14.3px;line-height:19.3px;color:#111;white-space:nowrap;padding-top:5.4mm}
  .kp-head .c2{margin-left:18.7mm;width:62mm;flex:none}
  .kp-head .c3{flex:1}
  .kp-head b{font-weight:bold}
  .kp-body{padding:3mm 12mm 0}
  .kp-title{text-align:center;font-size:15px;font-weight:bold;margin:8px 0 14px;color:#111}
  .kp-greet{font-size:12.5px;color:#111;margin:6px 0;line-height:1.5}
  .kp-party{font-size:12.5px;margin:4px 0;color:#111}
  .kp-party b{font-weight:bold}
  .kp-center{text-align:center;font-size:14px;font-weight:bold;margin:16px 0 10px;color:#111}
  .tech{display:grid;grid-template-columns:repeat(4,1fr);margin:6px 0 12px;text-align:center}
  .tech .l{font-size:12px;font-weight:bold;margin-bottom:6px;color:#111}
  .tech .v{font-size:17px;font-weight:bold;color:#111}
  table.eq{width:100%;border-collapse:collapse;font-size:12px}
  table.eq th{background:#8cc63f;color:#173a17;font-weight:bold;border:1px solid #7cb23a;padding:6px 8px;text-align:center;font-size:12px}
  table.eq td{border:1px solid #c9c9c9;padding:6px 8px;vertical-align:top;color:#111}
  table.eq td:nth-child(n+3){white-space:nowrap}
  .kp-topay{text-align:right;font-weight:bold;font-size:13px;margin-top:10px;color:#111}
  .kp-words{text-align:right;color:#555;font-size:10px;margin-top:2px}
  table.vig1{border-collapse:collapse;width:58%;font-size:12px;margin-top:14px}
  table.vig1 td{border:1px solid #c9c9c9;padding:6px 9px;color:#111}
  table.vig1 td.v{text-align:right;font-weight:bold;font-size:14px;white-space:nowrap}
  .sub-h{font-weight:bold;font-size:13px;margin:16px 0 6px;color:#111}
  table.calc{border-collapse:collapse;width:74%;font-size:11.5px}
  table.calc td{border:1px solid #c9c9c9;padding:6px 8px;text-align:center;color:#111}
  table.calc td.val{font-weight:bold;font-size:16px}
  .v-green{color:#2ea82e}.v-black{color:#111}.v-orange{color:#f5a623}.v-red{color:#e8402a}
  /* блок кредиту (Ощадбанк) */
  table.cred-glob{border-collapse:collapse;width:72%;font-size:12.5px;margin-top:8px}
  table.cred-glob td{border:1px solid #c9c9c9;padding:6px 10px}
  table.cred-glob td:first-child{background:#f3f8f4;font-weight:600}
  table.cred-glob td.v{text-align:right;font-weight:bold}
  table.cred{border-collapse:collapse;width:100%;font-size:11px;margin-top:10px;table-layout:fixed}
  table.cred td{border:1px solid #c9c9c9;padding:6px 5px;text-align:center;word-wrap:break-word}
  table.cred tr:first-child td{background:#8cc63f;color:#173a17;font-weight:bold;font-size:10px}
  table.cred td.b{font-weight:bold;font-size:12px}
  .cred-bankname{font-weight:bold;font-size:12.5px;color:#173a17;margin:12px 0 3px}
  .kp-mini{font-size:10.5px;color:#666;margin-top:6px;text-align:center;font-style:italic}
  .kp-note{font-size:11px;font-weight:bold;margin-top:16px;line-height:1.5;color:#111}
  .kp-note .ast{color:#e8402a;font-weight:bold}
  /* фото реалізованих проєктів: один ряд (4 фото) або два ряди по 2 фото — коли на сторінці є вільне місце */
  .pr{width:100%;margin:8px auto 0;background-repeat:no-repeat;background-size:100% 100%}
  .pr.half{background-size:200% 100%}
  .pr.half.right{background-position:right center}
  /* 6 плиток переваг (HTML, замість скріншота — різкіше) */
  .adv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:6px}
  .adv-card{background:linear-gradient(135deg,#b6e368,#38ba3b);border-radius:15px;padding:15px 13px;text-align:center;display:flex;flex-direction:column;align-items:center}
  .adv-card svg{width:40px;height:40px;stroke:#0e2c0e;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:9px}
  .adv-card .t{font-weight:bold;font-size:11.5px;color:#0e2c0e;margin-bottom:3px;line-height:1.25}
  .adv-card .d{font-size:10px;color:#123312;line-height:1.35}
  /* графік генерації по місяцях (у КП) */
  .gen-chart{margin-top:16px}
  .gen-chart .bars{display:flex;align-items:flex-end;gap:5px;height:132px;padding-top:6px;border-bottom:2px solid #cfd6dd}
  .gen-chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  .gen-chart .val{font-size:9px;font-weight:bold;color:#2a3a2c;margin-bottom:3px;white-space:nowrap}
  .gen-chart .bar{width:66%;background:linear-gradient(180deg,#a6d95a,#2ea82e);border-radius:3px 3px 0 0}
  .gen-chart .mon{display:flex;gap:5px;margin-top:5px}
  .gen-chart .mon div{flex:1;text-align:center;font-size:10px;color:#555;font-weight:600}
  /* блок калькулятора монтажу (керуючий, НЕ друкується в КП) */
  .mount-card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:210mm;max-width:100%;margin:22px auto 0;padding:18px 22px}
  .mount-card h3{margin:0;font-size:16px}
  .mount-card .sub{color:var(--muted);font-size:12px;margin:4px 0 8px}
  .mount-card .blk{font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--green-d);margin:14px 0 4px}
  .mount-card table{width:100%;border-collapse:collapse;font-size:12.5px}
  .mount-card td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  .mount-card td.q{width:80px}
  .mount-card td.q input{width:70px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;text-align:center;font-size:13px;font-family:inherit}
  .mount-card td.q input:focus{outline:none;border-color:var(--green)}
  .mount-card td.p{text-align:right;white-space:nowrap;color:var(--muted);width:120px}
  .mount-card td.s{text-align:right;white-space:nowrap;font-weight:600;width:120px}
  .mount-card tr.subtot td{border-bottom:none;font-weight:800;color:var(--ink);padding-top:6px}
  .mount-card .foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .empty{display:grid;place-items:center;height:70vh;color:var(--muted);text-align:center}
  .empty .big{font-size:40px;margin-bottom:10px}
  @media (max-width:1100px){.app{grid-template-columns:1fr}.side{height:auto}}
</style>
</head>
<body>
<div class="app">
  <!-- ЛІВА ПАНЕЛЬ -->
  <aside class="side">
    <div class="brand">
      <div class="logo">G</div>
      <div><h1>Генератор КП</h1><small>Green Building · сонячні станції</small></div>
    </div>

    <div class="step">
      <div class="step-h"><span class="n">1</span> Хто створює КП</div>
      <select id="manager"></select>
      <div class="hint" id="mgrPhone"></div>
    </div>

    <div class="step">
      <div class="step-h"><span class="n">2</span> Угода в CRM</div>
      <label>Посилання на угоду</label>
      <input id="dealUrl" placeholder="https://app.keepincrm.com/…/agreements/12345">
      <button class="btn btn-ghost" style="margin-top:8px" onclick="loadDeal()">Завантажити дані угоди</button>
      <div class="hint" id="dealInfo"></div>
    </div>

    <div class="step">
      <div class="step-h"><span class="n">3</span> Формат КП</div>
      <!-- Формат вибирається першим: від нього залежить і склад обладнання, і які поля далі має
           сенс заповнювати. До 21.10.2026 це була галочка «Без панелей» у кінці конфігурації —
           менеджер спершу заповнював поля СЕС, а потім їх же й відміняв. -->
      <div class="seg">
        <button id="fSes" class="on" onclick="setFormat('ses')">Повна СЕС</button>
        <button id="fUps" onclick="setFormat('ups')">ДБЖ</button>
      </div>
      <div class="hint" id="fmtHint"></div>
    </div>

    <div class="step">
      <div class="step-h"><span class="n">4</span> <span id="cfgTitle">Конфігурація станції</span></div>
      <div id="sesSeg" class="seg">
        <button id="mA" class="on" onclick="setMode('station')">Готова станція</button>
        <button id="mB" onclick="setMode('manual')">Вручну</button>
      </div>
      <div id="modeStation">
        <label>Оберіть станцію</label>
        <select id="station"></select>
      </div>
      <!-- Інвертор руками — і для СЕС «Вручну», і для ДБЖ: готових ДБЖ у списку станцій немає. -->
      <div id="modeManual" style="display:none">
        <div class="row">
          <div><label>Інвертор</label><select id="inverter"></select></div>
          <div><label>Кількість інверторів</label>
            <input id="invCount" type="number" min="0" value="1" placeholder="0 — без інвертора"></div>
        </div>
      </div>
      <!-- Модель АКБ стоїть поза режимами: у наявності лежать різні моделі однакової ємності
           (Deye, Sunwoda, без бренду), і для готової станції вибір так само за менеджером. -->
      <label>АКБ — модель</label>
      <select id="battModel"></select>
      <div id="battCountField"><label>Кількість АКБ</label>
        <input id="battCount" type="number" min="0" value="1" placeholder="0 — без АКБ"></div>

      <div id="upsPanelsBox">
        <label style="margin-top:12px">Панелі</label>
        <div class="seg">
          <button id="pNo" class="on" onclick="setUpsPanels(false)">Без панелей</button>
          <button id="pYes" onclick="setUpsPanels(true)">З панелями</button>
        </div>
      </div>

      <!-- Панелі обираються так само, як АКБ: у наявності не одна модель, а кількість менеджер
           ставить руками, коли клієнт докуповує панелі окремо від станції. -->
      <div id="panelPick">
        <label>Панелі — модель</label>
        <select id="panelModel"></select>
        <div class="row">
          <div><label>Кількість, шт</label>
            <input id="panelCount" type="number" min="1" placeholder="авто"></div>
          <div id="panelKwField"><label>Цільова потужність, кВт</label>
            <input id="panelKw" type="number" step="0.1" value="8"></div>
        </div>
      </div>
      <label class="opt"><input id="withProt" type="checkbox" checked> Захисна автоматика</label>
      <!-- Монтаж ДБЖ ставиться й окремо від станції (рішення власника 30.10.2026): у повній СЕС
           він є завжди, тому галочка показується тільки в ДБЖ. -->
      <label class="opt" id="mountOptBox"><input id="withMount" type="checkbox" onchange="syncForm()"> Монтажні роботи</label>
    </div>

    <!-- Монтаж не питаємо: повна СЕС без монтажу не буває (це вже ДБЖ), а ДБЖ рахується без нього.
         Лишились тільки дані обʼєкта, потрібні калькулятору монтажу. -->
    <div class="step" id="stepMount">
      <div class="step-h"><span class="n">5</span> Обʼєкт</div>
      <div id="mountFields">
        <div class="row">
          <div><label>Поверховість</label>
            <select id="floors"><option>1</option><option>2</option><option>3</option></select></div>
          <div><label>Км до обʼєкта (туди-назад)</label><input id="km" type="number" min="1" placeholder="обовʼязково"></div>
        </div>
        <label>Покриття даху</label>
        <select id="roof"></select>
      </div>
    </div>

    <div class="step">
      <div class="step-h"><span class="n">6</span> Клієнт</div>
      <div id="consField"><label>Споживання клієнта, кВт/міс</label>
        <input id="consumption" type="number" value="500"></div>
      <div class="hint" id="consHint"></div>
      <label class="opt"><input id="withUbd" type="checkbox"> Знижка УБД 3%</label>
      <div class="hint">У КП покажемо і повну суму, і суму зі знижкою.</div>
    </div>

    <details class="adv">
      <summary>Додатково (тарифи, місто)</summary>
      <label>Місто / область клієнта</label>
      <input id="city" placeholder="напр. Бахмач, Чернігівська обл.">
      <div class="row">
        <div><label>Ціна зараз, ₴</label><input id="priceNow" type="number" step="0.1"></div>
        <div><label>Прогноз, ₴</label><input id="priceFc" type="number" step="0.1"></div>
      </div>
    </details>

    <div id="warnBox"></div>

    <div style="margin-top:20px">
      <button class="btn btn-primary" onclick="generateFresh()">Згенерувати превʼю</button>
      <button class="btn btn-dark" id="btnPdf" onclick="downloadPdf()" disabled>Завантажити PDF</button>
      <button class="btn btn-ghost" id="btnPush" style="margin-top:8px;border-color:var(--green);color:var(--green-d)" disabled onclick="pushToCrm()">Підтвердити та перенести товари в CRM</button>
    </div>
  </aside>

  <!-- ПРАВА ПАНЕЛЬ -->
  <main class="main">
    <div class="toolbar">
      <div class="status" id="status">Заповніть опитувальник ліворуч та натисніть «Згенерувати превʼю».</div>
      <div class="sp"></div>
      <div class="status" id="rateInfo"></div>
      <div class="pill" id="numPill"></div>
    </div>
    <div class="stage">
      <div id="doc" class="kp-doc">
        <div class="empty"><div><div class="big">🟢</div>Превʼю КП зʼявиться тут</div></div>
      </div>
    </div>
    <div id="mountBlock" class="mount-card" style="display:none"></div>
  </main>
</div>

<script>
// ⬇️ Після деплою бекенду на Render вставте сюди його адресу, напр. "https://kp-proxy.onrender.com"
const RENDER_API = "";
// Локально (сервіс відкрито через сам проксі) — той самий origin; file:// — localhost.
const API = RENDER_API || (location.protocol === "file:" ? "http://localhost:8790" : "");

// Безкоштовний Render присипляє сервіс після 15 хв простою і на пробудження віддає
// СВОЮ сторінку помилки (HTML) замість JSON — саме її менеджери бачили як «вікно з рендера».
// Тут воно перетворюється на зрозуміле повідомлення, а не на мовчазну порожню форму.
async function api(path, opts){
  const r = await fetch(API+path, opts);
  const t = await r.text();
  try{ return JSON.parse(t); }
  catch(e){ throw new Error("сервіс недоступний (HTTP "+r.status+"), зачекайте 30 с і спробуйте ще раз"); }
}
function bootMsg(html){
  let b=document.getElementById("bootMsg");
  if(html===null){ if(b) b.remove(); return; }
  if(!b){ b=document.createElement("div"); b.id="bootMsg";
    b.style.cssText="position:fixed;left:0;right:0;top:0;z-index:99;padding:10px 16px;"+
      "text-align:center;background:var(--warn);color:#fff;font-weight:600";
    document.body.appendChild(b); }
  b.innerHTML=html;
}

/* Один розрахунок прапорців на весь генератор: і видимість полів, і тіло запиту читають його.
   Два окремих списки умов (форма окремо, buildReq окремо) розʼїхались би на першій же правці —
   у формі поле вже сховане, а в запит з нього досі щось їде. */
function formFlags(){
  const ups = FORMAT === "ups";
  const hasPanels = !ups || UPS_PANELS;       // ДБЖ без панелей — єдиний випадок без них
  const manual = ups || MODE === "manual";    // готових ДБЖ у списку станцій немає
  // Повна СЕС без монтажу не буває (це вже ДБЖ), а ДБЖ продається і з монтажем, і без —
  // тому питаємо галочкою тільки в ДБЖ.
  const mount = !ups || document.getElementById("withMount").checked;
  return {ups, hasPanels, manual, mount,
          // Споживання рахує економію на е/е — без панелей її немає, поле нічого не змінює.
          needCons: hasPanels};
}
function syncForm(){
  const f = formFlags(), sh = (id, on) => document.getElementById(id).style.display = on ? "" : "none";
  document.getElementById("fSes").classList.toggle("on", !f.ups);
  document.getElementById("fUps").classList.toggle("on", f.ups);
  document.getElementById("cfgTitle").textContent = f.ups ? "Конфігурація ДБЖ" : "Конфігурація станції";
  document.getElementById("fmtHint").textContent = f.ups
    ? "Інвертор + АКБ. Панелі — за вибором нижче."
    : "Інвертор + АКБ + панелі, з генерацією, вигодами та кредитом.";
  sh("sesSeg", !f.ups);
  sh("modeStation", !f.ups && MODE === "station");
  sh("modeManual", f.manual);
  sh("battCountField", f.manual);             // у готовій станції кількість АКБ задає сама станція
  sh("upsPanelsBox", f.ups);
  document.getElementById("pNo").classList.toggle("on", !UPS_PANELS);
  document.getElementById("pYes").classList.toggle("on", UPS_PANELS);
  sh("mountOptBox", f.ups);
  sh("panelPick", f.hasPanels);
  sh("panelKwField", f.hasPanels && f.manual);
  sh("stepMount", f.mount);
  if(!f.mount) document.getElementById("mountBlock").style.display = "none";
  sh("consField", f.needCons);
  [...document.querySelectorAll(".step")].filter(e => e.style.display !== "none")
    .forEach((e, i) => { const n = e.querySelector(".step-h .n"); if (n) n.textContent = i + 1; });
  document.getElementById("consHint").textContent = f.needCons ? ""
    : "Без панелей економія на е/е не рахується — споживання не потрібне.";
}

function buildReq(){
  const m=CFG.managers.find(x=>x.name===document.getElementById("manager").value)||{};
  const f=formFlags();
  const req={ mode: f.manual ? "manual" : "station",
    manager:m.name, manager_phone:m.phone,
    client_name: DEAL?.client_name||"", client_phone: DEAL?.client_phone||"",
    client_city: document.getElementById("city").value,
    number: CUR_NUMBER, date: today(),
    consumption: +document.getElementById("consumption").value,
    floors: +document.getElementById("floors").value,
    km: +document.getElementById("km").value,
    roof: document.getElementById("roof").value };
  if(MOUNT_OVERRIDE) req.mounting_override = MOUNT_OVERRIDE;
  if(!f.manual){ req.station=document.getElementById("station").value; }
  else{
    const o=JSON.parse(document.getElementById("inverter").value||"{}");
    req.inverter_kw=o.kw; req.inverter_phase=o.phase;
    // Нуль або порожнє поле = позиції в КП немає (инвертор, АКБ і панелі вимикаються окремо).
    req.inverter_count=+document.getElementById("invCount").value||0;
    req.panel_kw=+document.getElementById("panelKw").value;
    req.battery_count=+document.getElementById("battCount").value;
  }
  req.battery_id=+document.getElementById("battModel").value;
  if(f.hasPanels){
    req.panel_id=+document.getElementById("panelModel").value||0;
    req.panel_count=+document.getElementById("panelCount").value||0;
  }
  req.no_mounting=!f.mount;
  req.no_panels=!f.hasPanels;
  req.no_protection=!document.getElementById("withProt").checked;
  req.ubd=document.getElementById("withUbd").checked;
  return req;
}
async function generate(){
  document.getElementById("status").textContent="Підбір обладнання та розрахунок…";
  document.getElementById("warnBox").innerHTML="";
  CUR_NUMBER = await kpNumberPeek();   // наступний глобальний номер (без фіксації)
  const req=buildReq();
  let r;
  try{ r = await api("/api/preview",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(req)}); }
  catch(e){ document.getElementById("status").textContent="Помилка: "+e.message; return; }
  if(r.error){ document.getElementById("status").textContent="Помилка: "+r.error; return; }
  if(!r.ok){
    document.getElementById("warnBox").innerHTML="<div class='warn-box'><b>Неможливо сформувати КП:</b><br>"+(r.warnings||[]).join("<br>")+"</div>";
    document.getElementById("status").textContent="КП не сформовано — див. повідомлення вище.";
    return;
  }
  PREVIEW={req, data:r};
  if(r.warnings && r.warnings.length)
    document.getElementById("warnBox").innerHTML="<div class='warn-box'>"+r.warnings.join("<br>")+"</div>";
  await renderKP(req,r);
  renderMounting(r.mounting, r.mounting_totals);
  document.getElementById("btnPdf").disabled=false;
  document.getElementById("btnPush").disabled = !(DEAL&&DEAL.id);
  document.getElementById("status").textContent="Превʼю готове. Перевірте та завантажте PDF / перенесіть у CRM.";
  return true;
}
function generateFresh(){ MOUNT_OVERRIDE=null; generate(); }

/* ── Блок калькулятора монтажних робіт (керуючий, не в PDF) ── */
function renderMounting(rows, totals){
  if(!rows || !rows.length){ document.getElementById("mountBlock").style.display="none"; return; }
  const names={montazh:"Монтажні роботи", vytratni:"Витратні матеріали", vidr:"Відрядження, доставка"};
  let html=`<h3>Калькулятор монтажних робіт</h3>`+
    `<div class="sub">Прозорий розрахунок монтажу. Можна змінити кількість і натиснути «Перерахувати КП» — ціни у пропозиції оновляться. У самому PDF цей блок не друкується.</div>`;
  for(const b of ["montazh","vytratni","vidr"]){
    const rr=rows.filter(r=>r.block===b);
    const sub=rr.reduce((s,r)=>s+r.sum,0);
    html+=`<div class="blk">${names[b]}</div><table>`;
    rr.forEach(r=>{ html+=`<tr>
       <td>${r.label}</td>
       <td class="q"><input type="number" min="0" step="1" data-key="${r.key}" value="${r.qty}"></td>
       <td class="p">× ${money(r.price)}</td>
       <td class="s">${money(r.sum)}</td></tr>`; });
    html+=`<tr class="subtot"><td colspan="3">Разом · ${names[b]}</td><td class="s">${money(sub)}</td></tr></table>`;
  }
  html+=`<div class="foot">
      <button class="btn btn-primary" style="width:auto;padding:10px 20px" onclick="recalcMounting()">Перерахувати КП</button>
      <span class="sub" style="margin:0">У КП піде: <b>Витратні матеріали</b> = ${money(totals.vytratni)} · <b>Монтажні послуги</b> = ${money(totals.montazh_poslugy)}</span>
    </div>`;
  const box=document.getElementById("mountBlock");
  box.innerHTML=html; box.style.display="block";
}
async function recalcMounting(){
  const ov={};
  document.querySelectorAll("#mountBlock input[data-key]").forEach(i=>{ ov[i.dataset.key]=parseFloat(i.value)||0; });
  MOUNT_OVERRIDE=ov;
  /* Тільки на успішному перерахунку: інакше «перераховано» перебивало б повідомлення про помилку. */
  if(await generate())
    document.getElementById("status").textContent="КП перераховано з урахуванням ваших правок монтажу.";
}

/* ── Числа прописом (гривні, українською) ── */
function wordsUAH(amount){
  const gr=Math.floor(amount), kop=Math.round((amount-gr)*100);
  const ones=["","один","два","три","чотири","пʼять","шість","сім","вісім","девʼять"],
    onesF=["","одна","дві","три","чотири","пʼять","шість","сім","вісім","девʼять"],
    teens=["десять","одинадцять","дванадцять","тринадцять","чотирнадцять","пʼятнадцять","шістнадцять","сімнадцять","вісімнадцять","девʼятнадцять"],
    tens=["","","двадцять","тридцять","сорок","пʼятдесят","шістдесят","сімдесят","вісімдесят","девʼяносто"],
    huns=["","сто","двісті","триста","чотириста","пʼятсот","шістсот","сімсот","вісімсот","девʼятсот"];
  function triple(n,fem){
    let s=[], h=Math.floor(n/100), t=Math.floor((n%100)/10), o=n%10;
    if(h) s.push(huns[h]);
    if(t>1){ s.push(tens[t]); if(o) s.push((fem?onesF:ones)[o]); }
    else if(t===1) s.push(teens[o]);
    else if(o) s.push((fem?onesF:ones)[o]);
    return s.join(" ");
  }
  function skl(n,f){ n=n%100; if(n>=11&&n<=14) return f[2]; n=n%10; return n===1?f[0]:(n>=2&&n<=4?f[1]:f[2]); }
  let parts=[], mil=Math.floor(gr/1000000), th=Math.floor((gr%1000000)/1000), rest=gr%1000;
  if(mil){ parts.push(triple(mil,false)+" "+skl(mil,["мільйон","мільйони","мільйонів"])); }
  if(th){ parts.push(triple(th,true)+" "+skl(th,["тисяча","тисячі","тисяч"])); }
  if(rest||!parts.length) parts.push(triple(rest,false));
  let g=parts.join(" ").replace(/\s+/g," ").trim();
  g=g.charAt(0).toUpperCase()+g.slice(1);
  return `${g} ${skl(gr,["гривня","гривні","гривень"])} ${String(kop).padStart(2,"0")} ${skl(kop,["копійка","копійки","копійок"])}`;
}

  /* «Комплексність вартості» обіцяє монтаж і доставку в ціні — у КП на обладнання це неправда. */

  /* У КП на ДБЖ панелей немає — гарантія на них у тексті обіцяє те, чого клієнт не купує. */

  const adv=`<div class="adv-grid">${advCards.map(a=>`<div class="adv-card">${a[0]}<div class="t">${a[1]}</div><div class="d">${a[2]}</div></div>`).join("")}</div>`;
  document.getElementById("numPill").textContent="КП № "+req.number;
  // Блоки йдуть суцільним потоком; розкладає їх по сторінках paginate() — за фактичною висотою,
  // тому порожнього місця не лишається (раніше сторінки були зашиті жорстко: 4 шт., половина порожня).

     </table>

     <div class="kp-topay">Знижка УБД ${d.discount_pct}%: −${money(d.discount)}</div>
     <div class="kp-topay">До сплати: ${money(d.total_pay)}</div>
     <div class="kp-words">(${wordsUAH(d.total_pay)})</div>`
     : `<div class="kp-topay">До сплати: ${money(d.total)}</div>
     <div class="kp-words">(${wordsUAH(d.total)})</div>`}`,

       <tr><td>Ціна електроенергії зараз</td><td class="v v-orange">${dec(e.price_now)} ₴</td></tr>

/* Розкладка блоків по сторінках A4: блок переїжджає на наступну сторінку лише якщо реально не влазить.
   Так вертикальний простір заповнюється щільно, без білих полотен. */
/* Шапка КП: хвиля й логотип — картинки, контакти — текст із COMPANY. */
function kpHeader(){
  const A = window.KP_ASSETS || {}, C = COMPANY, b = A.banner || '';
  return `<div class="kp-wave"><img src="${b}"></div>
    <div class="kp-head">
      <div class="kp-logo"><img src="${b}" alt="Green Building"></div>
      <div class="cc c2"><b>Адреса:</b> ${C.address[0]}<br>${C.address[1]}<br>
        <b>Телефон:</b> ${C.phone}</div>
      <div class="cc c3"><b>${C.entity}</b><br>
        <b>Пошта:</b> ${C.email}<br><b>Сайт:</b> ${C.site}</div>
    </div>`;
}
async function paginate(blocks){
  const doc=document.getElementById("doc");
  const PAD_BOTTOM=45;            // 12mm нижнє поле сторінки, px
  doc.innerHTML="";
  let page, body;
  const newPage = withBanner => {
    page=document.createElement("div"); page.className="kp-page";
    if(withBanner) page.innerHTML = kpHeader();
    body=document.createElement("div"); body.className="kp-body";
    if(!withBanner) body.style.paddingTop="10mm";
    page.appendChild(body); doc.appendChild(page);
  };
  newPage(true);
  // висоту можна міряти тільки після декодування картинок (інакше img = 0px і розкладка бреше)
  const wait = () => Promise.all([...doc.querySelectorAll("img")].map(i=>i.decode().catch(()=>{})));
  await wait();
  const PROJ_AR=3.8;                       // пропорції смуги фото (1900×500)
  const sizeProjects = () => body.querySelectorAll(".pr").forEach(r=>{
    if(!r.style.height) r.style.height = (r.offsetWidth/(r.classList.contains("half")?PROJ_AR/2:PROJ_AR))+"px";
  });
  const pages=[];
  for(const html of blocks){
    const el=document.createElement("div"); el.innerHTML=html;
    body.appendChild(el); sizeProjects();
    await wait();
    const fits = el.offsetTop + el.offsetHeight <= page.clientHeight - PAD_BOTTOM;
    if(!fits && body.children.length>1){    // на порожній сторінці лишаємо як є (нема куди переносити)
      body.removeChild(el);
      pages.push([page, body]);
      newPage(false);
      body.appendChild(el); sizeProjects();
      await wait();
    }
  }
  pages.push([page, body]);
  for(const [pg, bd] of pages) fillPage(pg, bd, PAD_BOTTOM, PROJ_AR);
}

/* Заповнення залишку сторінки: фото проєктів розкладаємо у два ряди (вдвічі крупніші),
   решту вільної висоти розподіляємо між блоками — щоб низ не виглядав обірваним. */
function fillPage(page, body, PAD, AR){
  const kids = () => [...body.children];
  const freeSpace = () => page.clientHeight - PAD - Math.max(...kids().map(k=>k.offsetTop+k.offsetHeight));
  const pr = body.querySelector(".pr:not(.half)");
  if(pr && freeSpace() > 150){
    const h = Math.min(pr.offsetWidth/(AR/2), (pr.offsetHeight + freeSpace() - 14)/2);
    const box = pr.parentNode;
    // клонуємо (а не збираємо рядком) — картинка це base64 у style, у HTML-рядку вона б зламала атрибут
    const half = right => {
      const c = pr.cloneNode(false);
      c.className = "pr half" + (right ? " right" : "");
      c.style.width = Math.round(h*AR/2) + "px";
      c.style.height = Math.round(h) + "px";
      return c;
    };
    box.append(half(false), half(true));
    pr.remove();
  }
  const gaps = kids().length - 1;
  const free = freeSpace();
  if(gaps > 0 && free > 40)               // рівномірний «повітряний» розподіл, але не більше 60px на проміжок
    kids().slice(1).forEach(k=>{ k.style.marginTop = Math.min(60, free/gaps) + "px"; });
}
function fitDoc(){
  const stage=document.querySelector(".main"), doc=document.getElementById("doc");
  const avail=stage.clientWidth-52, pageW=794; // 210mm ≈ 794px @96dpi
  const s=Math.min(1, avail/pageW);
  doc.style.transform=`scale(${s})`;
}
window.addEventListener("resize",fitDoc);

// Сторінки КП рендеряться html2canvas'ом, тобто в PDF лягає картинка без текстового шару —
// «Генератор рахунків та договорів» такий файл прочитати не може. Тому структуру КП кладемо
// в метадані (/Keywords, ASCII base64), звідки він її і читає (маркер GBKP1).
function kpMetaB64(){
  const req=PREVIEW.req, d=PREVIEW.data, t=d.tech||{};
  const payload={ v:1, number:req.number, date:req.date,
    client:{ name:req.client_name||"", phone:req.client_phone||"", city:req.client_city||"" },
    manager:{ name:req.manager||"", phone:req.manager_phone||"" },
    tech:{ ses_kw:t.ses_kw, panels_kw:t.panels_kw, inverter_kw:t.inverter_kw, battery_kwh:t.battery_kwh },
    lines:(d.lines||[]).map(l=>({ title:l.title, unit:l.unit, qty:l.qty, price:l.price, sum:l.sum })),
    // total лишається сумою позицій — на нього зав'язаний extractPdfText() генератора рахунків;
    // знижка їде окремими полями, щоб рахунок міг порахувати і її.
    total:d.total, discount:d.discount||0, total_pay:d.total_pay ?? d.total };
  const bytes=new TextEncoder().encode(JSON.stringify(payload));
  let s=""; bytes.forEach(b=>{ s+=String.fromCharCode(b); });
  return btoa(s);
}
async function downloadPdf(){
  const btn=document.getElementById("btnPdf"); btn.disabled=true; btn.textContent="Формування PDF…";
  try{
    const finalNum = await kpNumberCommit();            // зафіксувати глобальний номер КП
    if(finalNum){ PREVIEW.req.number=finalNum; await renderKP(PREVIEW.req, PREVIEW.data); }
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF("p","mm","a4");
    const pages=document.querySelectorAll(".kp-page");
    for(let i=0;i<pages.length;i++){
      const canvas=await html2canvas(pages[i],{scale:2,useCORS:true,backgroundColor:"#fff"});
      const img=canvas.toDataURL("image/jpeg",0.92);
      if(i>0) pdf.addPage();
      const hmm=Math.min(297, canvas.height/(canvas.width/210)); // натуральна висота, без сжатия
      pdf.addImage(img,"JPEG",0,0,210,hmm);
    }
    pdf.setProperties({ keywords:"GBKP1:"+kpMetaB64() });
    pdf.save(`КП №${PREVIEW.req.number} ${PREVIEW.req.client_name||""}.pdf`);
    CUR_NUMBER = await kpNumberPeek();
    document.getElementById("numPill").textContent="КП № "+CUR_NUMBER;
    document.getElementById("status").textContent="PDF завантажено. Перекиньте його у блок «Документи» угоди вручну.";
  }catch(e){ alert("Помилка PDF: "+e.message); }
  btn.textContent="Завантажити PDF"; btn.disabled=false;
}
async function pushToCrm(){
  if(!DEAL||!DEAL.id){ alert("Спочатку завантажте угоду (крок 2)."); return; }
  if(!confirm(`Перенести ${PREVIEW.data.lines.length} позицій у угоду №${DEAL.id} (${DEAL.client_name})?\nЗагальна сума: ${money(PREVIEW.data.total)}`)) return;
  const btn=document.getElementById("btnPush"); btn.disabled=true; btn.textContent="Перенесення…";
  try{
    const r=await api("/api/push",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({deal_id:DEAL.id, lines:PREVIEW.data.lines, total:PREVIEW.data.total})});
    if(r.ok){
      document.getElementById("status").textContent=`✔ Перенесено ${r.added} позицій у угоду №${DEAL.id}. Сума угоди: ${money(parseFloat(String(r.deal_total).replace(/\s/g,'').replace(',','.'))||PREVIEW.data.total)}.`;
      btn.textContent=`✔ Перенесено (${r.added})`; return;
    } else { alert(r.error || "CRM не додала товари: невідома помилка"); }  // позиції могли створитись — текст помилки з проксі це і розрізняє
  }catch(e){ alert("Помилка: "+e.message); }
  btn.textContent="Підтвердити та перенести товари в CRM"; btn.disabled=false;
}
boot();
